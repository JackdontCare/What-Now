<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#39236c"><title>What Now? 🎲</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="A playful companion for choosing what to do with your free time."><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#251c48;background:#24164b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#4b2a87,#24164b 65%);min-height:100vh}main{max-width:520px;margin:auto;padding:16px 15px 105px}h1{font-size:34px;color:#ffda67;text-shadow:3px 3px #8d4d99;margin:5px 0}h2{font-size:21px;margin:8px 0 14px}.sub{color:#ddd3ff;margin:4px 0 18px}.panel{background:#fff9f1;border:3px solid #bca6ed;border-radius:22px;padding:17px;margin:14px 0;box-shadow:0 6px 0 #1b123b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn,button,select,input,textarea{font:inherit}button{cursor:pointer;border:2px solid #34225b;border-radius:13px;padding:10px 12px;background:#fff;color:#2b2054;font-weight:750;box-shadow:0 3px 0 #34225b}button:active{transform:translateY(2px);box-shadow:0 1px 0 #34225b}.primary{background:#ffc954}.purple{background:#d8b6ff}.mint{background:#aaf2c8}.blue{background:#b6dfff}.danger{background:#ffd0d6}.small{font-size:12px;padding:7px 9px}.activeBtn{background:#ffc954;outline:2px solid #fff}.card{border:2px solid #7153ad;border-radius:17px;padding:12px;margin:9px 0;background:linear-gradient(120deg,#d8eaff,#fff);box-shadow:0 3px 0 #7556a5}.card:nth-child(3n){background:linear-gradient(120deg,#ffe1eb,#fff)}.card:nth-child(3n+2){background:linear-gradient(120deg,#d5ffe1,#fff)}.cardTitle{font-size:17px;font-weight:850}.muted{color:#6d6184;font-size:13px}.dots{color:#e92c4b;letter-spacing:2px;font-weight:900}.pill{background:#e9ddff;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}nav{position:fixed;bottom:0;left:0;right:0;background:#fff9ff;border-top:3px solid #9b7ad6;display:flex;justify-content:space-around;padding:9px 3px max(10px,env(safe-area-inset-bottom));z-index:10}nav button{border:0;box-shadow:none;background:transparent;font-size:12px;padding:7px 3px;min-width:55px}nav button.sel{background:#e2d3ff}input,select,textarea{border:2px solid #b8a5da;border-radius:10px;padding:10px;background:white;min-width:0;width:100%}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}details{margin:10px 0}summary{cursor:pointer;font-weight:750}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.stat{background:#f0e6ff;padding:12px;border-radius:15px;text-align:center}.stat strong{font-size:24px;display:block}.bar{height:16px;background:#e8def3;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#8861dc}.tag{display:inline-block;margin:3px;background:#f1e6ff;border-radius:9px;padding:5px 7px;font-size:12px}.notice{background:#fff2bb;padding:10px;border-radius:12px;font-size:13px}.trophy{padding:11px;background:#fff1c9;border-radius:14px;margin:8px 0}footer{color:#e6dcff;text-align:center;font-size:12px;padding:12px}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#25184a;color:white;border-radius:14px;padding:12px 18px;z-index:99;display:none;max-width:90%;text-align:center}
</style></head><body><main><header><h1>🎲 What Now?</h1><div class="sub">Your free time. Your adventure. ✨</div></header><div id="home"></div><div id="activities" class="hidden"></div><div id="stats" class="hidden"></div><div id="trophies" class="hidden"></div><div id="more" class="hidden"></div><footer>Rest counts, too. 💜</footer></main><nav id="nav"></nav><div id="toast"></div><script>
const KEY='whatnow-v1';const cats=['Gaming','Creative','Reading','Self-care','Relaxation','Responsibilities','Social','Other'];const icons={'Gaming':'🎮','Creative':'🎨','Reading':'📚','Self-care':'🌱','Relaxation':'🛋️','Responsibilities':'🧹','Social':'💞','Other':'✨'};const sample=[['Play Donkey Kong','Gaming',20,120],['Play Guitar','Creative',10,60],['Stretch','Self-care',5,20],['3D Printing','Creative',15,60],['Read a Book','Reading',10,null],['Work on a Vibe Coding Project','Creative',20,null],['Watch YouTube','Relaxation',null,null],['Browse Reddit','Relaxation',null,null]];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.items))state={items:sample.map((x,i)=>({id:'s'+i,name:x[0],category:x[1],min:x[2],max:x[3],priority:'Normal',status:'active',until:null,dots:0,created:Date.now(),lastShown:null,lastChosen:null,shown:0})),events:[],time:30,offers:[],tab:'home',auditAt:0};let editId=null,plan=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function event(type,id,extra={}){state.events.push({type,id,date:new Date().toISOString(),...extra})}function available(){let now=Date.now();for(let a of state.items){if(a.status==='snoozed'&&a.until&&new Date(a.until).getTime()<=now){a.status='active';a.until=null}}return state.items.filter(a=>a.status==='active')}function eligible(t){return available().filter(a=>!a.min||a.min<=t)}function score(a,t){let days=a.lastShown?Math.min(35,(Date.now()-a.lastShown)/86400000):15;let p= a.priority==='High'?2:a.priority==='Low'?.8:1;let maxPenalty=a.max&&t>a.max?.82:1;return Math.max(.1,(2+Math.min(a.dots,12)*1.2+days*.6)*p*maxPenalty)}function pick(arr,t,n){let pool=[...arr],out=[];while(pool.length&&out.length<n){let weights=pool.map(a=>score(a,t)),sum=weights.reduce((a,b)=>a+b,0),r=Math.random()*sum,k=0;while(k<weights.length-1&&(r-=weights[k])>0)k++;out.push(pool.splice(k,1)[0])}return out}function suggest(){let arr=eligible(state.time);let previous=new Set(state.offers);let fresh=arr.filter(a=>!previous.has(a.id));let chosen=pick(fresh.length>=3?fresh:arr,state.time,3);state.offers=chosen.map(a=>a.id);chosen.forEach(a=>{a.lastShown=Date.now();a.shown++});save();render()}function selectActivity(id){let a=state.items.find(x=>x.id===id);if(!a)return;let before=state.offers.slice();for(let oid of before){if(oid!==id){let other=state.items.find(x=>x.id===oid);if(other){other.dots++;event('passed',oid,{selected:id})}}}a.dots=0;a.lastChosen=Date.now();event('selected',id,{minutes:state.time,offered:before});state.offers=[];save();toast('✨ Adventure logged: '+a.name);render()}function status(id,s){let a=state.items.find(x=>x.id===id);if(!a)return;a.status=s;if(s==='active')a.until=null;event(s,id);save();render()}function snooze(id){let x=prompt('Snooze for how many days? (e.g. 5)','5');if(x===null)return;let days=Number(x);if(!Number.isFinite(days)||days<=0){toast('Enter a positive number of days');return}let a=state.items.find(a=>a.id===id);a.status='snoozed';a.until=new Date(Date.now()+days*86400000).toISOString();event('snoozed',id,{days});state.offers=state.offers.filter(x=>x!==id);save();render()}function undoLast(){let ev=state.events.pop();if(!ev)return;toast('Last history event removed (activity status unchanged)');save();render()}function card(a,mode='list'){let time=(a.min??'Any')+'–'+(a.max??'∞')+' min';let dots=a.dots?`<span class="dots" title="Passed over ${a.dots} times">${'🔴'.repeat(Math.min(a.dots,5))}${a.dots>5?'+'+(a.dots-5):''}</span>`:'';return `<div class="card"><div class="row between"><div class="cardTitle">${icons[a.category]||'✨'} ${esc(a.name)}</div>${dots}</div><div class="muted">${esc(a.category)} · ${time} · ${esc(a.priority)} priority</div>${a.goal?`<div class="muted">🎯 ${esc(a.goal)}</div>`:''}${mode==='offer'?`<div class="row" style="margin-top:10px"><button class="primary" onclick="selectActivity('${a.id}')">▶ Pick this!</button><button class="small purple" onclick="snooze('${a.id}')">💤 Snooze</button></div>`:`<div class="row" style="margin-top:10px"><button class="small mint" onclick="selectActivity('${a.id}')">▶ Choose</button><button class="small" onclick="edit('${a.id}')">✏️ Edit</button><button class="small purple" onclick="snooze('${a.id}')">💤</button><button class="small" onclick="status('${a.id}', '${a.status==='paused'||a.status==='snoozed'?'active':'paused'}')">${a.status==='paused'||a.status==='snoozed'?'▶ Resume':'⏸ Pause'}</button><button class="small blue" onclick="status('${a.id}','completed')">🏁</button></div>`}${a.status==='snoozed'?`<div class="muted">Returns ${new Date(a.until).toLocaleDateString()}</div>`:''}</div>`}
function home(){let offers=state.offers.map(id=>state.items.find(a=>a.id===id)).filter(a=>a&&a.status==='active');return `<section class="panel"><h2>⏱️ How much time?</h2><div class="row">${[10,15,20,30,60,120].map(t=>`<button class="small ${state.time===t?'activeBtn':''}" onclick="setTime(${t})">${t>=60?t/60+' hr':t+' min'}</button>`).join('')}<button class="small" onclick="customTime()">Custom</button></div><div class="row" style="margin-top:14px"><button class="primary" onclick="suggest()">🎲 ${offers.length?'Shuffle Suggestions':'Quick Pick'}</button><button class="purple" onclick="makePlan()">🗺️ Plan My Time</button></div></section>${offers.length?`<section class="panel"><h2>✨ Your three suggestions</h2>${offers.map(a=>card(a,'offer')).join('')}<div class="notice">Choosing one gives the other two a red dot. Shuffling does not.</div></section>`:''}<section class="panel"><h2>📚 Browse activities</h2>${available().length?available().map(a=>card(a)).join(''):'No active activities yet.'}<button class="primary" onclick="go('activities');edit(null)">＋ Add Activity</button></section>`}
function setTime(t){state.time=t;state.offers=[];save();render()}function customTime(){let n=Number(prompt('How many minutes?',state.time));if(n>0&&n<10000)setTime(n)}
function makePlan(){let remaining=state.time,arr=pick(eligible(remaining),remaining,6);plan=[];for(let a of arr){if(remaining<5)break;let duration=Math.min(remaining,a.max||remaining,Math.max(a.min||5,Math.min(remaining,20)));if(duration>remaining)continue;plan.push({id:a.id,minutes:duration});remaining-=duration}if(!plan.length){toast('Add activities that fit your time first');return}go('more');$('more').innerHTML=`<section class="panel"><h2>🗺️ Plan My Time</h2><p>Optional activity mix for ${state.time} minutes. Pick each activity when you actually start it.</p>${plan.map(p=>{let a=state.items.find(x=>x.id===p.id);return `<div class="card">${icons[a.category]} <b>${esc(a.name)}</b> · ${p.minutes} min <button class="small mint" onclick="selectActivity('${a.id}')">▶ Log</button></div>`}).join('')}<button onclick="makePlan()">🔀 New Plan</button><button onclick="go('home')">Back</button></section>`}
function activities(){return `<section class="panel"><div class="row between"><h2>🎒 My Activities</h2><button class="primary" onclick="edit(null)">＋ Add</button></div><div class="row" id="filters">${['all','active','snoozed','paused','completed'].map(x=>`<button class="small" onclick="filterActivities('${x}')">${x}</button>`).join('')}</div><div id="activityList">${state.items.map(a=>card(a)).join('')}</div></section><section class="panel hidden" id="formPanel"></section>`}
function filterActivities(s){$('activityList').innerHTML=state.items.filter(a=>s==='all'||a.status===s).map(a=>card(a)).join('')||'<p>No activities here.</p>'}function edit(id){go('activities');editId=id;let a=state.items.find(x=>x.id===id)||{};$('formPanel').classList.remove('hidden');$('formPanel').innerHTML=`<h2>${id?'Edit':'Add'} Activity</h2><label>Name *</label><input id="fName" maxlength="100" value="${esc(a.name||'')}" placeholder="e.g. Play guitar"><details ${id?'open':''}><summary>Optional details</summary><label>Category</label><select id="fCat">${cats.map(c=>`<option ${a.category===c?'selected':''}>${c}</option>`).join('')}</select><div class="grid2"><div><label>Minimum minutes</label><input id="fMin" type="number" min="1" value="${a.min??''}"></div><div><label>Maximum minutes</label><input id="fMax" type="number" min="1" value="${a.max??''}"></div></div><label>Priority</label><select id="fPriority">${['Low','Normal','High'].map(p=>`<option ${a.priority===p?'selected':''}>${p}</option>`).join('')}</select><label>Goal</label><input id="fGoal" value="${esc(a.goal||'')}"><label>Notes</label><textarea id="fNotes">${esc(a.notes||'')}</textarea></details><div class="row" style="margin-top:14px"><button class="primary" onclick="saveActivity()">💾 Save</button><button onclick="$('formPanel').classList.add('hidden')">Cancel</button>${id?`<button class="danger" onclick="removeActivity('${id}')">🗑 Delete</button>`:''}</div>`;$('formPanel').scrollIntoView({behavior:'smooth'})}function saveActivity(){let name=$('fName').value.trim();if(!name){toast('Enter an activity name');return}let min=$('fMin')?.value?Number($('fMin').value):null,max=$('fMax')?.value?Number($('fMax').value):null;if(min&&max&&min>max){toast('Minimum must not exceed maximum');return}let a=state.items.find(x=>x.id===editId);if(!a){a={id:'a'+Date.now()+Math.random().toString(36).slice(2,6),status:'active',dots:0,shown:0,lastShown:null,lastChosen:null,created:Date.now()};state.items.push(a)}Object.assign(a,{name,category:$('fCat')?.value||'Other',min,max,priority:$('fPriority')?.value||'Normal',goal:$('fGoal')?.value||'',notes:$('fNotes')?.value||''});save();toast('Activity saved!');render()}function removeActivity(id){if(!confirm('Delete this activity? Its historical events remain in the export.'))return;state.items=state.items.filter(a=>a.id!==id);state.offers=state.offers.filter(x=>x!==id);save();render()}
function stats(){let now=Date.now(),week=state.events.filter(e=>e.type==='selected'&&new Date(e.date).getTime()>now-7*86400000),month=state.events.filter(e=>e.type==='selected'&&new Date(e.date).getTime()>now-30*86400000);let counts={};for(let e of week){let a=state.items.find(a=>a.id===e.id);let c=a?.category||'Other';counts[c]=(counts[c]||0)+1}let max=Math.max(1,...Object.values(counts));return `<section class="panel"><h2>📊 My Week</h2><div class="grid2"><div class="stat"><strong>${week.length}</strong>Selections (7 days)</div><div class="stat"><strong>${month.length}</strong>Selections (30 days)</div></div><p class="muted">Selections are assumed activities, not verified completion or measured time.</p><h2>By Category</h2>${Object.entries(counts).length?Object.entries(counts).map(([c,n])=>`<div style="margin:12px 0"><div class="row between"><b>${icons[c]||'✨'} ${esc(c)}</b><span>${n}</span></div><div class="bar"><div style="width:${n/max*100}%"></div></div></div>`).join(''):'Choose an activity to start your history!'}<h2>Recent Adventures</h2>${state.events.filter(e=>e.type==='selected').slice(-15).reverse().map(e=>`<div class="tag">${new Date(e.date).toLocaleDateString()} · ${esc(state.items.find(a=>a.id===e.id)?.name||'Deleted activity')}</div>`).join('')||'No selections yet.'}</section>`}
const badges=[['🎲','First Adventure',e=>e.filter(x=>x.type==='selected').length>=1],['🌈','Variety Pack',e=>new Set(e.filter(x=>x.type==='selected').map(x=>state.items.find(a=>a.id===x.id)?.category)).size>=5],['🎨','Creative Spark',e=>new Set(e.filter(x=>x.type==='selected'&&state.items.find(a=>a.id===x.id)?.category==='Creative').map(x=>x.id)).size>=3],['🏁','Quest Complete',e=>e.some(x=>x.type==='completed')],['💤','Sleeping Beauty',e=>e.some(x=>x.type==='snoozed')&&e.some(x=>x.type==='selected'&&e.some(s=>s.type==='snoozed'&&s.id===x.id&&s.date<x.date))],['🔴','Rediscovered',e=>e.some(x=>x.type==='selected'&&x.offered?.some(y=>y===x.id)&&e.filter(p=>p.type==='passed'&&p.id===x.id&&p.date<x.date).length>=5)]];function trophies(){return `<section class="panel"><h2>🏆 Trophy Room</h2><p>${badges.filter(b=>b[2](state.events)).length} / ${badges.length} unlocked</p>${badges.map(([icon,name,fn])=>`<div class="trophy">${fn(state.events)?icon:'🔒'} <b>${esc(name)}</b> ${fn(state.events)?'✨':''}</div>`).join('')}</section>`}
function download(name,text,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function exportJSON(){download('what-now-backup.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json')}function exportCSV(){let rows=[['date','event','activity_id','activity','category','minutes','passed_over_current']];for(let e of state.events){let a=state.items.find(a=>a.id===e.id);rows.push([e.date,e.type,e.id,a?.name||'',a?.category||'',e.minutes??'',a?.dots??''])}download('what-now-history.csv',rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}function aiReport(){let report={instructions:'Analyze this personal free-time activity dataset. Selections are assumed, not verified. Passed-over events mean an activity was offered but another chosen; do not interpret them as failures. Identify interests, variety, activities repeatedly passed over, and gently suggest activities to modify, snooze, or remove. Avoid guilt or productivity pressure.',generatedAt:new Date().toISOString(),activities:state.items,history:state.events};download('what-now-chatgpt-analysis.json',JSON.stringify(report,null,2),'application/json')}
function importFile(input){let file=input.files?.[0];if(!file)return;file.text().then(t=>{try{let x=JSON.parse(t);if(!Array.isArray(x.items)||!Array.isArray(x.events))throw Error('Invalid backup');if(!confirm('Replace your current activities and history with this backup?'))return;state={...x,tab:'more',offers:[],time:x.time||30};save();render();toast('Backup restored')}catch(e){toast('Could not read this backup')}})}function audit(){let candidates=state.items.filter(a=>a.status!=='completed').sort((a,b)=>(b.dots||0)-(a.dots||0)).slice(0,5);return `<section class="panel"><h2>🔄 Activity Check-In</h2><p>Review a few activities whenever you feel like it.</p>${candidates.map(a=>`<div class="card"><b>${icons[a.category]} ${esc(a.name)}</b> <span class="dots">${a.dots?'🔴 '+a.dots:''}</span><div class="row" style="margin-top:9px"><button class="small mint" onclick="status('${a.id}','active')">Keep</button><button class="small purple" onclick="snooze('${a.id}')">Snooze</button><button class="small" onclick="status('${a.id}','paused')">Pause</button><button class="small blue" onclick="status('${a.id}','completed')">Complete</button></div></div>`).join('')}</section>`}function more(){return `${audit()}<section class="panel"><h2>📦 Export & Backup</h2><p class="muted">All data stays in this browser unless you export it. Back up regularly: clearing browser data may erase it.</p><div class="row"><button class="primary" onclick="aiReport()">🤖 ChatGPT Report</button><button onclick="exportJSON()">📥 JSON Backup</button><button onclick="exportCSV()">📊 CSV</button></div><label>Restore JSON backup</label><input type="file" accept="application/json,.json" onchange="importFile(this)"><p class="notice">To get an AI analysis, download the ChatGPT Report and upload it to a ChatGPT conversation.</p></section>`}const tabs=[['home','🏠','Home'],['activities','🎒','Activities'],['stats','📊','Stats'],['trophies','🏆','Trophies'],['more','⚙️','More']];function go(tab){state.tab=tab;save();render();window.scrollTo(0,0)}function render(){available();$('nav').innerHTML=tabs.map(([id,icon,name])=>`<button class="${state.tab===id?'sel':''}" onclick="go('${id}')">${icon}<br>${name}</button>`).join('');for(let [id] of tabs)$(id).classList.toggle('hidden',state.tab!==id);let funcs={home,activities,stats,trophies,more};$(state.tab).innerHTML=funcs[state.tab]();save()}render();
</script><script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
}
</script></body></html>
